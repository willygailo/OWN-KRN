    <text x="28" y="166"><tspan fill="#34d399" font-weight="700">[ OK ]</tspan><tspan fill="#e2e8f0"> GDT/TSS, IDT (256 vectors + IST1 #DF), PIC, PIT (100 Hz), KBD/TTY</tspan></text>
