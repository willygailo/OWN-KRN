    <text x="28" y="435" fill="#cbd5e1">2     1     RUN     U3    5       sh</text>

    <text x="28" y="458"><tspan fill="#34d399" font-weight="700">ownkrn:/# </tspan><tspan fill="#f8fafc" font-weight="600">hello OwnKrn</tspan></text>
